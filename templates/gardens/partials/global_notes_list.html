<div id="global-notes-list">
  <div class="row g-3">
    {% for n in notes %}
      <div class="col-12 col-md-6">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title mb-1">{{ n.title }}</h5>
            <p class="card-text text-muted small mb-2">by {% if n.author %}{{ n.author.username }}{% else %}Anonymous{% endif %} • {{ n.created_at|date:"Y-m-d" }}</p>
            <div class="mb-2" style="white-space:pre-wrap">{{ n.note }}</div>
            <div class="d-flex gap-2">
              {% if user.is_authenticated and n.author and n.author.id == user.id %}
                <form method="post" action="{% url 'gardens:global_note_delete' n.id %}" hx-post="{% url 'gardens:global_note_delete' n.id %}" hx-include="this" hx-swap="outerHTML" hx-confirm="Delete note?">
                  {% csrf_token %}
                  <button class="btn btn-sm btn-outline-danger">Delete</button>
                </form>
                <button class="btn btn-sm btn-outline-secondary" hx-get="{% url 'gardens:global_note_edit' n.id %}" hx-target="#global-note-edit-{{ n.id }}">Edit</button>
              {% endif %}
            </div>
            <div id="global-note-edit-{{ n.id }}"></div>
          </div>
        </div>
      </div>
    {% empty %}
      <div class="col-12">
        <div class="muted">No notes yet.</div>
      </div>
    {% endfor %}
  </div>
</div>
