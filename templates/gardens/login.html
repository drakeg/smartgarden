{% extends "gardens/base.html" %}
{% block title %}Login - Smart Garden{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm rounded-4">
      <div class="card-body p-4">
        <h1 class="h5 mb-3">Login</h1>
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input id="username" class="form-control" name="username" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input id="password" class="form-control" type="password" name="password" required>
          </div>
          <button class="btn btn-primary w-100">Sign in</button>
          <p class="muted mt-3 mb-0">Create users in the Django admin for now (MVP).</p>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
