{% extends "gardens/base.html" %}
{% block title %}Confirmation Sent{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3>Check your email</h3>
        <p>We've sent a confirmation link to <strong>{{ email }}</strong>. Please click the link to activate your account.</p>
        <p class="muted">If you don't see the email, check your spam folder or try again.</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
