map $http_x_forwarded_proto $smartgarden_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10M;

    # Serve collected static
    location /static/ {
        alias /usr/share/nginx/html/static/;
        access_log off;
        expires 1y;
    }

    # Serve user-uploaded media from the persistent media volume.
    location /media/ {
        alias /usr/share/nginx/html/media/;
        access_log off;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }

    # Proxy requests to the Django app
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $smartgarden_forwarded_proto;
        proxy_pass http://web:8000;
    }
}
