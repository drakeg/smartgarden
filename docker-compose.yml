version: '3.8'

services:
  web:
    build: .
    # For dev we run migrations then Django devserver so code changes mount immediately.
    command: bash -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app:cached
      - staticfiles:/app/staticfiles
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=replace-me
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-}
      - CELERY_TASK_ALWAYS_EAGER=${CELERY_TASK_ALWAYS_EAGER:-False}
    depends_on: []

  redis:
    image: redis:7-alpine
    profiles: ["async-email"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  celery-worker:
    build: .
    profiles: ["async-email"]
    command: celery -A smartgarden worker --loglevel=info
    volumes:
      - .:/app:cached
    environment:
      - DEBUG=True
      - SECRET_KEY=replace-me
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_TASK_ALWAYS_EAGER=False
    depends_on:
      redis:
        condition: service_healthy

  # Optional Postgres service (uncomment to use Postgres in development)
  # db:
  #   image: postgres:15
  #   environment:
  #     POSTGRES_DB: smartgarden
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data

volumes:
  staticfiles:
  # pgdata:
