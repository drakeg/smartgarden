version: '3.8'

services:
  web:
    build: .
    command:
      - gunicorn
      - smartgarden.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "3"
      - --graceful-timeout
      - "25"
      - --timeout
      - "30"
    stop_grace_period: 30s
    env_file: .env.prod
    environment:
      - DJANGO_SETTINGS_MODULE=smartgarden.settings
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-}
    volumes:
      - staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ready/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: always

  db:
    image: postgres:18
    env_file: .env.prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:8-alpine
    profiles: ["async-email", "api-paywall"]
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  celery-worker:
    build: .
    profiles: ["async-email"]
    command: celery -A smartgarden worker --loglevel=info
    env_file: .env.prod
    environment:
      - DJANGO_SETTINGS_MODULE=smartgarden.settings
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  nginx:
    image: nginx:stable
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - staticfiles:/usr/share/nginx/html/static:ro
      - ./deploy/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: always

volumes:
  staticfiles:
  pgdata:
  redisdata:
