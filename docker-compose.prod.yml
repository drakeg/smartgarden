version: '3.8'

services:
  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput && \
             python manage.py collectstatic --noinput && \
             gunicorn smartgarden.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    env_file: .env.prod
    environment:
      - DJANGO_SETTINGS_MODULE=smartgarden.settings
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-}
    volumes:
      - staticfiles:/app/staticfiles
    depends_on:
      - db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: always

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: smartgarden
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:8-alpine
    profiles: ["async-email"]
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  celery-worker:
    build: .
    profiles: ["async-email"]
    command: celery -A smartgarden worker --loglevel=info
    env_file: .env.prod
    environment:
      - DJANGO_SETTINGS_MODULE=smartgarden.settings
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  nginx:
    image: nginx:stable
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - staticfiles:/usr/share/nginx/html/static:ro
      - ./deploy/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: always

volumes:
  staticfiles:
  pgdata:
  redisdata:
