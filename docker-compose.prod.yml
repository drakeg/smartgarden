version: '3.8'

services:
  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput && \
             python manage.py collectstatic --noinput && \
             gunicorn smartgarden.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    env_file: .env.prod
    environment:
      - DJANGO_SETTINGS_MODULE=smartgarden.settings
    volumes:
      - staticfiles:/app/staticfiles
    depends_on:
      - db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: always

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: smartgarden
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  nginx:
    image: nginx:stable
    ports:
      - "80:80"
    volumes:
      - staticfiles:/usr/share/nginx/html/static:ro
      - ./deploy/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: always

volumes:
  staticfiles:
  pgdata:
