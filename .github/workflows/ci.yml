name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate operational scripts
        run: sh -n scripts/backup_postgres.sh scripts/restore_postgres.sh scripts/backup_media.sh scripts/restore_media.sh scripts/backup_all.sh scripts/verify_backup_set.sh scripts/prune_backups.sh

      - name: Prepare test environment
        env:
          SECRET_KEY: ci-only-secret-key
        run: |
          mkdir -p staticfiles
          python manage.py check
          python manage.py migrate --noinput

      - name: Run tests
        env:
          SECRET_KEY: ci-only-secret-key
          PYTHONUNBUFFERED: 1
        run: python manage.py test --verbosity=2
